name: Build and Test

on: [push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.0
      with:
        python-version: '3.14'

    - name: Install Dependencies
      run: uv sync --all-extras

    - name: Run Makefile
      run: uv run make check
